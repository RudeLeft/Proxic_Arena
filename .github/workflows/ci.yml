# Test, then publish. Never the other way round.
#
# Deploying is now two clicks on the Unraid host, which makes a bad
# build as easy to ship as a good one. So nothing becomes `latest`
# until the suites that have actually caught defects in this project
# have run against the very image that would ship.
#
# Build once, test that image, promote it by retagging. A gate that
# tests one build and publishes another is not a gate.
#
# The three tiers, and what each has caught here:
#
#   checks   static analysis and 49 frontend tests
#   server   233 tests: authorization, migrations, sharing rules
#   browser  29 tests: the CSP breaking Pixi, an origin check that
#            refused the app's own requests, a login page nobody
#            could reach. Server tests passed through all three.
#
# The long tiers run on several machines at once (owner, 2026-10-21:
# "the checks take longer and longer"): server tests in three parts,
# the Mechanics Lab in three, the browser suite on seven. The repository
# is public, so the extra machines cost nothing, and every part is
# defined as "the rest" or dealt from the folder itself -- a new test
# can never fall between them.
#
# 2026-11-05, owner's "Faster CI Plan" (nothing tests less): the game
# specs are dealt over six machines by measured time, the rest on one;
# the Lab starts its longest scenarios first, over three machines, with
# its two timing benchmarks on their own; a push to main no longer
# cancels the run in progress; and a push that changes only
# documentation runs the checks alone (the image it would test is
# unchanged -- docs are not in it).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main a newer push waits for the run in progress instead of killing
# it (eight nearly finished runs were thrown away in two days, 2026-11-05);
# GitHub keeps only the newest waiting run, so a burst of pushes becomes
# one follow-up run of the latest commit. Branches and pull requests still
# cancel. Never a per-commit group: runs finishing out of order could
# promote an older image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rudeleft/proxic_arena
  # The candidate: built, tested, and only then promoted.
  CANDIDATE_TAG: ci-${{ github.sha }}

jobs:
  # Does this push change anything the image or the slow suites could see?
  # Compared with the last commit that passed everything -- the revision
  # label on :latest -- not the previous push, so a code push whose run was
  # folded into a later docs push is still tested. Anything uncertain
  # (another event, no label, a label that is not an ancestor, any error)
  # counts as code. docs/testing/ is read by the checks' ledger, Test Deck/
  # is the Lab's corpus, ci/ and .github/ are the gate itself: never docs.
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Classify the push
        id: classify
        run: |
          python3 -I ci/changes.py | tee -a "$GITHUB_OUTPUT"
          grep -q 'code=true' "$GITHUB_OUTPUT"             && echo '### Full suite' >> "$GITHUB_STEP_SUMMARY"             || echo '### Documentation only: the checks alone' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the candidate image
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.CANDIDATE_TAG }}
          build-args: |
            PROXIC_BUILD_ID=${{ github.sha }}
            PROXIC_REVISION=${{ github.sha }}
          # A registry cache, still mode=max so the Forge and worker stages
          # stay cached: exporting to the GitHub Actions cache took up to
          # 173 s of the critical path (2026-11-05). The old cache is still
          # read until the registry one exists.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  checks:
    name: Static analysis and unit tests
    runs-on: ubuntu-26.04
    # Every push, documentation included: it runs the Mechanics Lab ledger
    # check and the question record, which read docs/testing/.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ./gradlew :server:ktlintCheck :server:detekt --no-daemon

      # The Mechanics Lab ledger is generated from the read-only
      # corpus and a hand-maintained status file. Stale means one was
      # edited without regenerating, and the ledger is lying.
      - run: python3 scripts/mechanics-lab-ledger.py --check

      # PHASE_08 P8-C, P8-D: every piece of evidence the record of Forge's
      # questions names exists and runs in CI. (The worker's own build holds
      # the record to the compiled code: ForgeQuestionRecordTest.)
      - run: python3 -I scripts/check-question-record.py

      # Spec 0025 F-0025-A: the Forge release watch's report reads a new
      # question, a stale patch and a printing-dependent card correctly.
      - run: python3 -I scripts/forge-release-report.py --self-test

      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  server-tests:
    name: Server tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    # About twice a normal run (5-6 min), so a sick machine fails in 15
    # minutes, not 46 (run 42037203224).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Forge is gitignored, so without this the Forge-dependent
      # tests call assumeTrue and SKIP -- a green gate that never ran
      # card resolution or deck import. Rather than compile Forge a
      # second time, take the worker and the resource tree out of the
      # image that was just built with them.
      - name: Take the Forge worker and resources from the image
        run: |
          docker pull "$IMAGE:$CANDIDATE_TAG"
          id=$(docker create "$IMAGE:$CANDIDATE_TAG")
          mkdir -p forge-worker/target spikes/forge-phase0a/forge-upstream/forge-gui
          docker cp "$id:/app/forge/forge-worker.jar" \
            forge-worker/target/forge-worker-0.1.0.jar
          docker cp "$id:/app/forge/res" \
            spikes/forge-phase0a/forge-upstream/forge-gui/res
          docker rm "$id" > /dev/null
          ls -la forge-worker/target/

      # Part 1 is the deck and admin packages, part 2 match and room,
      # part 3 everything else (server/build.gradle.kts).
      - run: ./gradlew :server:test -PtestShard=${{ matrix.shard }} --no-daemon

      # A test that skips itself is not a test that passed. Phase 1
      # shipped two that silently never ran; this is the same failure
      # wearing CI clothes, where nobody is watching the console.
      #
      # Classes that legitimately cannot run here -- they need the
      # real Deck Builder export, gitignored because of its artwork --
      # are declared in ci/expected-skips.txt with the reason. Any
      # other skip fails the build, and is named.
      - name: Fail on undeclared skips
        if: always()
        run: sh ci/check-skips.sh server/build/test-results/test


  mechanics-lab:
    name: Mechanics Lab (${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    # Its own job since 2026-10-20: fifteen scenario games after the
    # server suite ran the Server tests job into its 45-minute limit.
    # Two machines since 2026-10-21, three since 2026-11-05: every third
    # scenario on each, the longest dealt first so none starts last.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Forge is gitignored, so without this the Forge-dependent
      # tests call assumeTrue and SKIP -- a green gate that never ran
      # card resolution or deck import. Rather than compile Forge a
      # second time, take the worker and the resource tree out of the
      # image that was just built with them.
      - name: Take the Forge worker and resources from the image
        run: |
          docker pull "$IMAGE:$CANDIDATE_TAG"
          id=$(docker create "$IMAGE:$CANDIDATE_TAG")
          mkdir -p forge-worker/target spikes/forge-phase0a/forge-upstream/forge-gui
          docker cp "$id:/app/forge/forge-worker.jar" \
            forge-worker/target/forge-worker-0.1.0.jar
          docker cp "$id:/app/forge/res" \
            spikes/forge-phase0a/forge-upstream/forge-gui/res
          docker rm "$id" > /dev/null
          ls -la forge-worker/target/

      # PHASE_06 P6-AA, P6-AE, P6-AG, P6-AC, P6-AD, P6-BF, P6-J, P6-U, P6-AL,
      # P6-AO, P6-AP, P6-AK, P6-BD, P6-I, P6-L and P6-G: Mechanics Lab
      # regressions, each a focused deck played against the worker taken
      # from this image. Exit 2 means the game never reached the scenario,
      # which proves nothing, so it fails too. Three at a time: each is
      # its own worker process and none depends on timing. Each prints its
      # whole output when it finishes, so the log stays readable. Each has
      # five minutes -- you-choose, cost-kinds and who-did-it fifteen: they
      # hold forty-odd games each; cost-kinds took about 9.5 minutes in CI
      # (2026-11-05) and once ran past ten with every game passing -- because a hung scenario once
      # ran the whole job into its time limit, and a killed job keeps no
      # log at all, so nobody could tell which one it was.
      # An INCONCLUSIVE scenario (exit 2) never reached its moment -- the
      # shuffle never dealt what it needed -- and proves nothing either
      # way, so it gets ONE more game (2026-10-21, after three
      # such flakes in a day). A WRONG answer (exit 1) is never retried.
      - name: Mechanics Lab regressions
        env:
          res: spikes/forge-phase0a/forge-upstream/forge-gui/res
          jar: forge-worker/target/forge-worker-0.1.0.jar
          shard: ${{ matrix.shard }}
        run: |
          # Kept, and uploaded when the job fails: a hung scenario prints
          # nothing, and its trace is the only account of what it waited on.
          traces="$RUNNER_TEMP/lab-traces"
          mkdir -p "$traces"
          export traces
          # Longest first (measured in CI, 2026-11-05), so the long ones
          # start at once instead of last: the job used to end with one
          # scenario running alone for two minutes. Dealt round-robin, so
          # each machine gets one of the longest. Every scenario is in this
          # list exactly once; a new one goes anywhere in it.
          printf '%s\n' \
              cost-kinds you-choose who-did-it card-actions numbers card-trays surveil sacrifice \
              many-triggers what-happened combat-choices stops blocks shapes modes \
              agent-of-kotis panglacial-wurm card-name leyline karn multiface \
              mindslaver characteristics player-state mana-choice alternate-win \
              attachments printings face-down costs results \
              tracked-state text-effects coin-flip board-data concede mana-cost \
              library-order mana-pool mulligan unreachable dice unset \
              take-backs trigger-costs land-mana spectator moves thrown-away mana-balls               play-log pay-picks seen-hands life-changes pt-changes copies \
            | awk -v shard="$shard" 'NR % 3 == shard % 3' \
            | xargs -n 1 -P 3 sh -c \
              'limit=300; case $0 in you-choose|cost-kinds|who-did-it|card-actions) limit=900;; esac;
               run() { timeout $limit python3 -I "scripts/check-$0.py" "$jar" "$res" "$traces/$0.jsonl" > "$traces/$0.log" 2>&1; };
               run; s=$?;
               if [ $s = 2 ]; then
                 echo "== $0 never reached its moment: one more game, fresh shuffle";
                 cp "$traces/$0.log" "$traces/$0.first-try.log"; run; s=$?;
               fi;
               [ $s = 124 ] && echo "== $0 HUNG: no result in $((limit / 60)) minutes";
               echo "== $0 (exit $s)"; cat "$traces/$0.log"; exit $s'
          # P6-L, over every game above: no question reaches a seat before
          # the state it refers to.
          python3 -I scripts/check-snapshot-first.py "$traces"/*.jsonl
          # P6-G, over the same games: no seat is sent a card from another
          # seat's hand that Forge did not show it.
          python3 -I scripts/check-hidden-hands.py "$traces"/*.jsonl
          # Spec 0064, over the same games: every card a seat's play log names
          # is one that seat's own snapshots named, and no line comes ahead
          # of the board it belongs to.
          python3 -I scripts/check-hidden-log.py "$traces"/*.jsonl
          # PHASE_07 P7-C, over the same games: every permanent Forge put on a
          # battlefield has a row, the one its current type line says.
          python3 -I scripts/check-kinds.py "$traces"/*.jsonl
          # PHASE_08: every question these games asked, for the job below,
          # which reads both halves of the Lab together.
          python3 -I scripts/check-questions-asked.py --summarise "$traces"/*.jsonl             > "$RUNNER_TEMP/questions-asked-$shard.txt"

      - uses: actions/upload-artifact@v6.0.0
        if: failure() || cancelled()
        with:
          name: mechanics-lab-traces-${{ matrix.shard }}
          path: ${{ runner.temp }}/lab-traces/
          retention-days: 7

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: questions-asked-${{ matrix.shard }}
          path: ${{ runner.temp }}/questions-asked-${{ matrix.shard }}.txt
          retention-days: 7

  # The two Lab checks that time something run on their own machine, one
  # after the other, never beside other games: a timing taken next to
  # three busy scenarios measures the neighbours. They write no traces, so
  # the trace checks above are unchanged (they used to follow a shard's
  # scenarios; moved 2026-11-05).
  lab-benchmarks:
    name: Mechanics Lab timings
    runs-on: ubuntu-26.04
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Take the Forge worker and resources from the image
        run: |
          docker pull "$IMAGE:$CANDIDATE_TAG"
          id=$(docker create "$IMAGE:$CANDIDATE_TAG")
          mkdir -p forge-worker/target spikes/forge-phase0a/forge-upstream/forge-gui
          docker cp "$id:/app/forge/forge-worker.jar" \
            forge-worker/target/forge-worker-0.1.0.jar
          docker cp "$id:/app/forge/res" \
            spikes/forge-phase0a/forge-upstream/forge-gui/res
          docker rm "$id" > /dev/null
      - name: Timings
        env:
          res: spikes/forge-phase0a/forge-upstream/forge-gui/res
          jar: forge-worker/target/forge-worker-0.1.0.jar
        run: |
          # forge_patches/0002: thousands of tokens at once (Krenko, Mob Boss)
          # stay playable. A benchmark: 110 s without the patch, ~41 s with it
          # on a development machine; the CI budget is generous.
          timeout 900 python3 -I scripts/check-token-speed.py "$jar" "$res" 100
          # §6.29: a player's pregame thinking time is not Forge's start budget.
          python3 -I scripts/check-start-budget.py "$jar" "$res"

  # PHASE_08: a question the record says Proxic answers must have been
  # asked in this run's Mechanics Lab games -- all three parts. A
  # scenario that stops reaching its question fails here, instead of
  # passing for a check that no longer checks anything.
  questions-asked:
    name: Every answered question was asked
    runs-on: ubuntu-26.04
    needs: [changes, mechanics-lab]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: questions-asked-*
          merge-multiple: true
          path: asked
      - run: python3 -I scripts/check-questions-asked.py asked/*.txt

  browser-tests:
    name: Browser tests (${{ matrix.part }})
    runs-on: ubuntu-26.04
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    # About twice the slowest machine's normal run (~10 min after the
    # 2026-11-05 split): a failure ends sooner than the old 45.
    timeout-minutes: 25
    # Seven machines, each with its own server and database, so the
    # test accounts on one cannot trip over another's. "other" is every
    # spec that is not a game spec; the game specs (match*.spec.ts) are
    # dealt over six by measured time (ci/browser-shard.mjs). Playwright's
    # own --shard split by count in file order, so one machine got every
    # real game and decided every run (~24 of ~27 min, 2026-11-05).
    strategy:
      fail-fast: false
      matrix:
        part: [other, match 1/6, match 2/6, match 3/6, match 4/6, match 5/6, match 6/6]
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the candidate stack
        run: |
          docker pull "$IMAGE:$CANDIDATE_TAG"
          # Ephemeral secrets: this database exists for ten minutes
          # and is thrown away. The real ones live on the host and
          # are never in this repository.
          {
            echo "POSTGRES_DB=proxic"
            echo "POSTGRES_USER=proxic"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "PROXIC_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "APP_ENV=production"
            echo "PROXIC_CI_IMAGE=$IMAGE:$CANDIDATE_TAG"
          } > .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          # From inside the box: the health checks do not exist from
          # outside it (owner 2026-10-24), and the version needs a
          # session; the image's own label says which build it is.
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T arena-server               wget -qO- http://127.0.0.1:8080/api/health/ready > /dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T arena-server             wget -qO- http://127.0.0.1:8080/api/health/ready

      # The accounts the suites sign in as. Passwords are the
      # defaults in e2e/helpers.ts, which exist only here and on a
      # developer's laptop.
      - name: Create the test accounts
        run: |
          server() { docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T arena-server "$@"; }
          printf '%s' 'a perfectly fine local passphrase' \
            | server /app/bin/arena-admin create RudeLeft --admin --password-stdin
          printf '%s' 'a perfectly ordinary player password' \
            | server /app/bin/arena-admin create Pat --password-stdin
          # Four more, for the concurrency specs: three matches at once
          # need six seats. Read from the file the tests read.
          # One name per line, then its password piped by node itself,
          # so no separator character has to survive the shell.
          for name in $(node -p 'require("./frontend/e2e/match-accounts.json").accounts.map(a => a.username).join(" ")'); do
            node -e 'process.stdout.write(require("./frontend/e2e/match-accounts.json").accounts.find(a => a.username === process.argv[1]).password)' "$name" \
              | server /app/bin/arena-admin create "$name" --password-stdin
          done

      # The real Deck Builder export is gitignored because it carries
      # Wizards of the Coast artwork, so CI builds a legal stand-in:
      # 65 basic lands and five generated PNGs. Without it every
      # import test would skip and the gate would pass having tested
      # no deck at all.
      - name: Build the CI deck package
        run: |
          mkdir -p "Test Deck"
          node scripts/make-ci-deck.mjs "Test Deck/ci-deck.zip"

      # And a deck that can CAST something. The gate deck above is
      # basics only on purpose, so it can never reach a decision
      # that only a spell asks for -- a planeswalker ability, its
      # loyalty cost, or which kind of counter it puts. Without
      # this, match-loyalty.spec.ts skips itself and the gate
      # passes having tested none of that.
      - name: Build the loyalty deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/loyalty-deck.zip" protocol/fixtures/planeswalker-deck

      # And one that names cards (P6-AG): without it
      # match-card-name.spec.ts skips and the search is never seen.
      - name: Build the card-name deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/card-name-deck.zip" protocol/fixtures/card-name-deck

      # And Leylines (P6-AC): a pregame action that is not a cast.
      - name: Build the Leyline deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/leyline-deck.zip" protocol/fixtures/leyline-deck

      # And Karn Liberated (P6-AD): the game restarting inside a match.
      - name: Build the Karn deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/karn-deck.zip" protocol/fixtures/karn-deck

      # And a two-faced card (P6-BF): Delver of Secrets turning over.
      - name: Build the Delver deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/delver-deck.zip" protocol/fixtures/delver-deck

      # And Mindslaver (P6-U): one player answering for another.
      - name: Build the Mindslaver deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/mindslaver-deck.zip" protocol/fixtures/mindslaver-deck

      # And a stolen creature (spec 0049): its picture from its owner's deck.
      - name: Build the stolen-creature deck packages
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/treason-deck.zip" protocol/fixtures/treason-deck
          node scripts/make-ci-deck.mjs "Test Deck/goblin-deck.zip" protocol/fixtures/goblin-deck

      # And art crops (spec 0051): the art window shows a card's crop.
      - name: Build the art-crop deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/crop-deck.zip" protocol/fixtures/crop-deck --crops

      # And printings (spec 0053): each printing wears its own picture.
      - name: Build the printings deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/printings-deck.zip" protocol/fixtures/printings-deck --printings

      # And player state (P6-AO): poison, energy, the monarch.
      - name: Build the player-state deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/state-deck.zip" protocol/fixtures/state-deck

      # And an alternate win (P6-AP): Laboratory Maniac.
      - name: Build the Maniac deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/maniac-deck.zip" protocol/fixtures/maniac-deck

      # And attachments (P6-AK): equipment, Auras across the table.
      - name: Build the attachment deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/attachment-deck.zip" protocol/fixtures/attachment-deck

      # And a swarm of identical Goblin tokens (specs 0036, 0037): big combats.
      - name: Build the swarm deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/swarm-deck.zip" protocol/fixtures/swarm-deck

      # And many triggers at once (PHASE_09 group 1): Boggart Shenanigans.
      - name: Build the triggers deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/triggers-deck.zip" protocol/fixtures/triggers-deck

      # And a printing Forge does not have (spec 0024): kept as picked.
      - name: Build the own-printing deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/own-printing-deck.zip" protocol/fixtures/own-printing-deck

      # And a face-down creature (P6-I): morph.
      - name: Build the morph deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/morph-deck.zip" protocol/fixtures/morph-deck

      # And the Ring and a dungeon (P6-AO): the Ring-bearer, the room.
      - name: Build the ring deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/ring-deck.zip" protocol/fixtures/ring-deck

      # And clicking on the board (PHASE_07 P7-G, P7-H): creatures with
      # nothing to activate, and burn that needs a target.
      - name: Build the interaction deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/interaction-deck.zip" protocol/fixtures/interaction-deck

      # And the card being cast (spec 0044): docked for a target, face
      # down to the opponent, shown for an optional cost.
      - name: Build the casting deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/casting-deck.zip" protocol/fixtures/casting-deck

      # And seeing what happened (spec 0045): counters' origins, a trigger
      # close up, Goblin Ringleader's reveal.
      - name: Build the what-happened deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/what-happened-deck.zip" protocol/fixtures/what-happened-deck

      # And sacrificing (spec 0001, F-0001-H): Innocent Blood, answered by
      # clicking your own creature on the board.
      - name: Build the sacrifice deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/sacrifice-deck.zip" protocol/fixtures/sacrifice-deck

      # And looking at your library (spec 0001, F-0001-H, D3): surveil and
      # scry, the cards as pictures to the player looking, alone.
      - name: Build the surveil deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/surveil-deck.zip" protocol/fixtures/surveil-deck

      # And the card trays (PHASE_09 group 3, W-07..W-10): putting cards
      # in order, scry, searching, Fact or Fiction's piles.
      - name: Build the card trays deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/card-trays-deck.zip" protocol/fixtures/card-trays-deck

      # Phase 9 W-11: the questions whose answer is a number (X, splitting
      # damage, multikicker, energy).
      - name: Build the numbers deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/numbers-deck.zip" protocol/fixtures/numbers-deck

      # And a creature nobody can answer (owner 2026-11-01, item 2): the
      # cast card lands straight on its place on the battlefield.
      - name: Build the landing deck package
        run: |
          node scripts/make-ci-deck.mjs "Test Deck/landing-deck.zip" protocol/fixtures/landing-deck

      - run: npm ci
        working-directory: frontend
      # The browser itself is cached by Playwright's version; its system
      # libraries are installed every time (they are not in the cache).
      - name: Which Playwright
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      # Every game spec dealt to exactly one machine, or this fails.
      - name: The deal covers every game spec
        if: matrix.part == 'other'
        run: node ci/browser-shard.mjs --check 6

      - name: Run the browser suite
        working-directory: frontend
        env:
          # The bundled Chromium; the msedge channel is a Windows
          # workaround and does not exist here.
          PROXIC_E2E_CHANNEL: bundled
          PART: ${{ matrix.part }}
        run: |
          # The concurrency specs reach into the server container (a worker
          # killed, memory read, the container restarted); they need its
          # name. They had skipped in CI until 2026-11-05 (owner).
          PROXIC_E2E_CONTAINER=$(docker compose -f ../docker-compose.yml -f ../docker-compose.ci.yml ps --format '{{.Name}}' arena-server)
          export PROXIC_E2E_CONTAINER
          echo "server container: $PROXIC_E2E_CONTAINER"
          if [ "$PART" = other ]; then
            npx playwright test --project=other
          else
            k=${PART#match }; k=${k%/6}
            mapfile -t files < <(node ../ci/browser-shard.mjs "$k" 6)
            printf 'game specs here:\n'; printf '  %s\n' "${files[@]}"
            npx playwright test --project=match "${files[@]}"
          fi

      - name: Server log, if anything failed
        # cancelled(): a shard stopped at its time limit leaves its evidence
        # too (2026-11-02: a cancelled shard left nothing to read).
        if: failure() || cancelled()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 200 arena-server

      - uses: actions/upload-artifact@v6.0.0
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ strategy.job-index }}
          # test-results/ holds what a failure leaves -- screenshots, the
          # trace, the page at the moment it failed. The line reporter
          # writes no playwright-report/, so this uploaded nothing and a
          # failure could not be seen after the run (2026-10-22).
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  publish:
    name: Promote to latest
    runs-on: ubuntu-26.04
    needs: [changes, build, checks, server-tests, mechanics-lab, lab-benchmarks, questions-asked, browser-tests]
    # Only main publishes. A pull request gets the full gate and
    # changes nothing anyone can deploy. A documentation-only push tests
    # no image, so it promotes none; success() keeps a skipped or failed
    # need from ever reaching here.
    if: >-
      success() && needs.changes.outputs.code == 'true'
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retag, not rebuild. The bytes that ship are the exact bytes
      # that passed, which is the whole point of a candidate tag.
      - name: Promote the tested image
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            "$IMAGE:$CANDIDATE_TAG"

      - name: Say what was published
        run: |
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "$IMAGE:latest"
            echo "$IMAGE:${{ github.sha }}"
            echo '```'
            echo ''
            echo 'Update the host: Compose plugin → Check for Updates → Update Stack.'
          } >> "$GITHUB_STEP_SUMMARY"
