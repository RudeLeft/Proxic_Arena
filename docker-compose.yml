# Production stack — PHASE_01 §1.53, §1.55, §1.58, §1.59.
#
# Two services run and are verified here: arena-server and postgres.
# cloudflared is defined but CANNOT be verified on a development
# machine (§1.48-§1.51 need the real host and a real tunnel token), so
# it sits behind a profile and is off by default. See the comment on
# that service.
#
# Phase 0A selected PER-MATCH CHILD JVM PROCESSES for Forge, so there
# is deliberately no always-running forge container here (§1.53).

# An explicit project name, because the default is the DIRECTORY
# name and both compose files would then share it. They did: starting
# the development stack REPLACED this stack's postgres container with
# the development one, and the production server immediately reported
# `database: unreachable`. The volumes were always distinct, so no
# data was lost, but the containers fought over one name.
name: proxic-arena

# Unraid reads these labels off a container and uses them on the
# Docker tab. Compose-created containers have no template, which is
# why they show a blank placeholder where every other container has
# a picture.
#
# The icon is served from this repository over raw.githubusercontent,
# which works because the repository is public and costs nothing to
# host. Unraid fetches it once and caches it.
x-unraid-icon: &unraid-icon
  net.unraid.docker.icon: "https://raw.githubusercontent.com/RudeLeft/Proxic_Arena/main/docs/assets/proxic-arena-icon.png"

services:
  postgres:
    image: postgres:16.15-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    restart: unless-stopped
    labels:
      # The same icon: it is this stack's database, and a row of
      # matching badges reads as one application rather than three
      # unrelated containers.
      <<: *unraid-icon
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    # NO ports: section. §1.39 forbids a public PostgreSQL binding,
    # and the server reaches it over the internal network by name.
    # §1.99 — minimal permissions. PostgreSQL needs its data volume
    # and a writable run directory; it needs no Linux capabilities
    # beyond the defaults it drops here, and nothing it runs should
    # ever gain more privilege than it started with.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The entrypoint drops from root to the postgres user.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  arena-server:
    # The PUBLISHED image, not a build.
    #
    # Deployment used to mean: pull the source, build a gigabyte of
    # image on the array, and hope Compose recreated the container.
    # It skipped the last step more than once, which is how a host
    # ran old code while reporting success.
    #
    # Now GitHub Actions builds on every push to main and publishes
    # here, so a server only ever PULLS. That also makes the Unraid
    # Compose plugin's "Check for Updates" work on this service: it
    # reads registries, and said "not checked" for a locally built
    # image because there was nothing to read.
    #
    # Local development builds from source instead -- see
    # docker-compose.local.yml, which adds the build back. The
    # default is the safe, boring one; building is the thing you ask
    # for.
    image: ghcr.io/rudeleft/proxic_arena:latest
    restart: unless-stopped
    labels:
      <<: *unraid-icon
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PROXIC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PROXIC_SESSION_SECRET: ${PROXIC_SESSION_SECRET:?set PROXIC_SESSION_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Spec 0014 — the invitation email. All optional: unset, invitations
      # are links an administrator copies and sends by hand.
      PROXIC_SMTP_HOST: ${PROXIC_SMTP_HOST:-}
      PROXIC_SMTP_PORT: ${PROXIC_SMTP_PORT:-587}
      PROXIC_SMTP_SECURITY: ${PROXIC_SMTP_SECURITY:-starttls}
      PROXIC_SMTP_USERNAME: ${PROXIC_SMTP_USERNAME:-}
      PROXIC_SMTP_PASSWORD: ${PROXIC_SMTP_PASSWORD:-}
      PROXIC_SMTP_FROM: ${PROXIC_SMTP_FROM:-}
    volumes:
      - app-data:/data
    networks:
      - internal
      - edge
    # §1.99, §1.59 — minimal permissions. The JVM needs no Linux
    # capabilities at all, and a read-only root filesystem means a
    # compromised process cannot rewrite the application it is
    # running. /tmp is a tmpfs because the JVM wants one.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # NO ports: section, deliberately (§1.51, §1.55). In production
    # the tunnel reaches this service over the `edge` network and no
    # host port is published at all.
    #
    # For local use, add the override that publishes it:
    #   docker compose -f docker-compose.yml -f docker-compose.local.yml up
    #
    # Publishing by default would mean the safe configuration is the
    # one someone has to remember, and the exposed one is what runs
    # if they forget.

  # NOT VERIFIED. Written from §1.48-§1.51 and never run: a tunnel
  # needs the real host and a real token, and this project does not
  # ship configuration it has only imagined working. Start it with
  #   docker compose --profile edge up
  # on the Unraid host, and treat its first run as the verification.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    profiles: ["edge"]
    command: tunnel --no-autoupdate run
    environment:
      # `:?` here would be wrong, and this was found by running it:
      # Compose interpolates EVERY service, including ones behind an
      # inactive profile, so a required-variable marker on this line
      # makes `docker compose up` fail for anyone who is not running
      # the edge -- which is everyone outside the Unraid host.
      # An empty token instead fails inside cloudflared, visibly, at
      # the moment someone actually asks for the edge.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - arena-server
    networks:
      - edge

volumes:
  postgres-data:
  app-data:

networks:
  # No external access. PostgreSQL lives only here.
  internal:
    internal: true
  edge:
