# Unraid override — stores data under /mnt/user/appdata.
#
#   docker compose up -d
#
# No -f flags: `scripts/unraid-setup.sh` writes COMPOSE_FILE into
# .env, which Compose reads for itself. That matters for the Unraid
# Compose Manager GUI, whose buttons run plain `docker compose`
# commands with no way to pass flags.
#
# WHY this exists. The base file uses NAMED volumes, which live inside
# Docker's own storage (/var/lib/docker). That works, but on Unraid it
# puts the database somewhere the array's backup routines, share
# settings and the Appdata Backup plugin do not look. Bind-mounting to
# /mnt/user/appdata puts it where the rest of the server's data lives.
#
# Easier to decide now than after there is a deck in it.
#
# Paths sit under proxic_arena/v2/ rather than directly in
# proxic_arena/.
#
# Found by deploying: something in Unraid's compose tooling writes
# `name` and `project_name` files into appdata subdirectories, and
# PostgreSQL's initdb REFUSES a data directory that is not empty --
# so the container restart-looped with "directory exists but is not
# empty". Two 8-byte files, each containing the word "postgres",
# were enough to stop the database starting.
#
# A dedicated subdirectory keeps the data away from whatever writes
# those, and away from the previous deployment's files.
#
# Run on the real host; the port note below came out of doing it.

name: proxic-arena

services:
  postgres:
    volumes:
      - /mnt/user/appdata/proxic_arena/v2/postgres:/var/lib/postgresql/data

  # One-shot: make the bind-mounted data directory writable by the
  # server, then exit.
  #
  # Docker creates a missing bind-mount source as root:root, and the
  # server deliberately runs as a non-root user (uid 100), so it
  # cannot write there -- card art fails with permission denied on
  # the first import. Phase 1 never wrote to /data, which is why this
  # only showed up when Phase 2 reached the host.
  #
  # Doing it here rather than in a setup command means a fresh
  # install, a moved appdata folder and a restored backup all end up
  # correct without anyone remembering a chown.
  #
  # §1.99 still holds: it is root for one chown, drops every
  # capability except the three that chown needs, cannot gain more,
  # and is gone before the server starts.
  init-data:
    image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
    user: root
    command: sh -c "chown -R 100:101 /data && chmod 0755 /data"
    volumes:
      - /mnt/user/appdata/proxic_arena/v2/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    restart: "no"

  arena-server:
    volumes:
      - /mnt/user/appdata/proxic_arena/v2/data:/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    # Always take the published image.
    #
    # The host builds nothing: GitHub Actions did that on push, and
    # the image carries the commit it was built from (PROXIC_BUILD_ID,
    # readable at /api/version). Updating is "Check for Updates" then
    # "Update Stack" in the Compose plugin -- no terminal, no git, no
    # 4 GB of build space on the array.
    pull_policy: always
    # PHASE 1 AMENDMENT 2. Port 8080 is taken on this host and the
    # existing cloudflared -- which runs OUTSIDE this stack -- is
    # already configured to reach the origin on 8765.
    #
    # §1.51 permits a host port when the actual tunnel configuration
    # requires one, which it does here. The better shape is still
    # available: attach cloudflared to this stack's `edge` network
    #
    #   docker network connect proxic-arena_edge <cloudflared>
    #
    # point it at http://arena-server:8080, and delete this block.
    # Then nothing is reachable from the LAN at all.
    #
    # Override the port with PROXIC_HOST_PORT in .env if 8765 is
    # ever taken too.
    ports:
      - "${PROXIC_HOST_PORT:-8765}:8080"
