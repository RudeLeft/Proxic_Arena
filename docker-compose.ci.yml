# CI override — run the stack from an image already built in this run.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# Like docker-compose.local.yml, but it does NOT build: the image
# under test was built once at the start of the run and is being
# tested before it is allowed to become `latest`. Building again here
# would test a different image than the one that ships.

name: proxic-arena-ci

services:
  arena-server:
    # Whatever tag the workflow put on the candidate image.
    image: ${PROXIC_CI_IMAGE:-ghcr.io/rudeleft/proxic_arena:latest}
    # Never pull, never build: the runner already has it.
    pull_policy: never
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The browser tests speak plain HTTP to localhost, and a
      # browser will not keep a Secure cookie over that -- the same
      # finding that produced owner decision D2 for the LAN port.
      PROXIC_SECURE_COOKIES: "false"
      # TEST ONLY -- spec 0098. Browser tests may deal set cards: the
      # server starts the worker with --lab-deal and mounts
      # POST /api/matches/test-deal. NEVER in docker-compose.yml,
      # docker-compose.unraid.yml or the Dockerfile; CI fails if they
      # name it (scripts/check-test-switch.py).
      PROXIC_TEST_DEALS: "true"
      # TEST ONLY -- Phase 11 P11-D4 (spec 0117). Every delta also carries the
      # whole board, and any page whose rebuilt board differs logs
      # DELTA_MISMATCH, which fails its test (e2e/match-helpers.ts): P11-R4's
      # browser gate, over every browser game. NEVER in production
      # (scripts/check-test-switch.py).
      PROXIC_TEST_DELTA_CHECK: "true"
      # P11-D4 -- spectators' deltas, off in production until owner decision 2
      # turns them on, are on here so the gate covers the spectators' view too
      # (match-watching, match-history). Off is today's whole boards, which the
      # server's tests hold (BoardDeltaTest).
      PROXIC_SPECTATOR_DELTAS: "true"
