# Local override — publishes the server on the loopback interface so
# the stack can be driven without a Cloudflare tunnel.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# It lives in its own file because the SAFE configuration should be
# the default, and the exposed one should be the thing you ask for
# (PHASE_01 1.51, 1.55, 1.99).
#
# Bound to 127.0.0.1 explicitly: "8080:8080" would expose the server
# to the LAN.

name: proxic-arena

services:
  arena-server:
    # Build from the working tree. The base file names a published
    # image; a developer wants the code in front of them, and
    # `pull_policy: build` means `up` rebuilds when sources change
    # rather than quietly reusing a tag.
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # PHASE_03 §3.22, §3.23 and owner decision D2.
      #
      # A browser will not STORE a Secure cookie delivered over
      # plain HTTP, and this override serves plain HTTP. So login
      # through it silently does nothing: the server sets the
      # cookie, the browser discards it, and the page bounces back
      # to /login with no error anywhere.
      #
      # Found by a browser test that failed while every server test
      # passed -- which is the difference between a cookie being
      # SENT and a cookie being KEPT.
      #
      # Production keeps Secure on (§3.23 forbids dropping it
      # because the tunnel's origin leg is HTTP), so this belongs
      # here, in the override that exists only for local use, and
      # nowhere else.
      PROXIC_SECURE_COOKIES: "false"
