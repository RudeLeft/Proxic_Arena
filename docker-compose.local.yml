# Local override — publishes the server on the loopback interface so
# the stack can be driven without a Cloudflare tunnel.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# It lives in its own file because the SAFE configuration should be
# the default, and the exposed one should be the thing you ask for
# (PHASE_01 1.51, 1.55, 1.99).
#
# Bound to 127.0.0.1 explicitly: "8080:8080" would expose the server
# to the LAN.

name: proxic-arena

services:
  arena-server:
    # Build from the working tree. The base file names a published
    # image; a developer wants the code in front of them, and
    # `pull_policy: build` means `up` rebuilds when sources change
    # rather than quietly reusing a tag.
    build:
      context: .
      dockerfile: Dockerfile
      # Which local build is this?
      #
      # The Dockerfile's default is the constant "dev", which is
      # honest about being unpublished and useless for telling two
      # local builds apart — and a developer rebuilds a dozen times
      # an afternoon. CI passes the commit sha; this passes
      # whatever the shell knows, falling back to the same honest
      # constant when it knows nothing.
      #
      #   export PROXIC_BUILD_ID="$(git rev-parse --short HEAD)$(git diff --quiet || echo -dirty)"
      #
      # The `-dirty` marker matters more than the sha: a build from
      # uncommitted changes labelled with a clean commit is worse
      # than one labelled "dev", because it looks trustworthy.
      args:
        PROXIC_BUILD_ID: ${PROXIC_BUILD_ID:-dev}
        PROXIC_REVISION: ${PROXIC_BUILD_ID:-unknown}
    # Each local stack its own image name (2026-11-22): both used the
    # published name, so building one stack could leave the other running
    # the wrong build (an A/B once ran the same image on both). Local only;
    # docker-compose.yml keeps the published name for Unraid.
    image: proxic-arena-local:${PROXIC_LOCAL_PORT:-8080}
    pull_policy: build
    ports:
      # A second local stack (owner 2026-11-21: two agents test at once):
      #   PROXIC_LOCAL_PORT=8081 docker compose -p proxic-arena-b
      #     -f docker-compose.yml -f docker-compose.local.yml up -d --build
      # Its own project name gives it its own database, so its own test
      # accounts. Point the tests at it with PROXIC_E2E_URL and
      # PROXIC_E2E_CONTAINER (see docs/operations/UPDATING.md).
      - "127.0.0.1:${PROXIC_LOCAL_PORT:-8080}:8080"
    environment:
      # PHASE_03 §3.22, §3.23 and owner decision D2.
      #
      # A browser will not STORE a Secure cookie delivered over
      # plain HTTP, and this override serves plain HTTP. So login
      # through it silently does nothing: the server sets the
      # cookie, the browser discards it, and the page bounces back
      # to /login with no error anywhere.
      #
      # Found by a browser test that failed while every server test
      # passed -- which is the difference between a cookie being
      # SENT and a cookie being KEPT.
      #
      # Production keeps Secure on (§3.23 forbids dropping it
      # because the tunnel's origin leg is HTTP), so this belongs
      # only in the overrides that never serve production: here, and
      # docker-compose.ci.yml.
      PROXIC_SECURE_COOKIES: "false"
      # TEST ONLY -- spec 0098. Browser tests may deal set cards: the
      # server starts the worker with --lab-deal and mounts
      # POST /api/matches/test-deal. NEVER in docker-compose.yml,
      # docker-compose.unraid.yml or the Dockerfile; CI fails if they
      # name it (scripts/check-test-switch.py).
      PROXIC_TEST_DEALS: "true"
      # TEST ONLY -- Phase 11 P11-D0. Timing marks in the server's log and
      # each match's worker log, for the kit's timeline measure
      # (`node ci/measure.mjs timeline`). Off unless the shell that brings
      # the stack up says so:
      #
      #   PROXIC_TEST_TIMING=true docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
      #
      # Nothing a player sees or is sent changes either way. NEVER in
      # docker-compose.yml, docker-compose.unraid.yml or the Dockerfile
      # (scripts/check-test-switch.py).
      PROXIC_TEST_TIMING: "${PROXIC_TEST_TIMING:-false}"
