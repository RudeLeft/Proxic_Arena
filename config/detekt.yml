# Detekt configuration — PHASE_01 §1.87.
#
# Built on detekt's defaults (buildUponDefaultConfig = true); this
# file only records the deliberate departures, each with the reason.

complexity:
  LongMethod:
    # Ktor's `routing { }` block is one long declarative function by
    # design. Splitting it to satisfy a counter would make it harder
    # to read, not easier.
    threshold: 120
  LongParameterList:
    # ServerConfig takes one parameter per setting on purpose.
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    # ForgeWorker.doProbe is a flat sequence of guard clauses, one
    # per §1.66 failure mode. Every branch returns. The alternative
    # that satisfies a lower number is a nested pyramid, which is
    # the thing complexity limits exist to prevent.
    threshold: 20
  NestedBlockDepth:
    # JDBC and java.util.zip both nest by design: connection ->
    # statement -> result set, zip -> stream -> entry. Closing each
    # resource in its own scope is the point, and flattening it
    # would mean leaking handles.
    threshold: 6

style:
  WildcardImport:
    # Ktor's documentation, samples and DSL are built around
    # wildcard imports (io.ktor.server.application.*). Expanding
    # every one is a large permanent diff against the ecosystem's
    # idiom in exchange for nothing. Same exemption as ktlint's.
    active: false
  MagicNumber:
    # Off, deliberately. Every remaining instance is a timeout, a
    # pool size or a port assigned to a named property at the call
    # site: `pingPeriod = Duration.ofSeconds(15)`,
    # `maximumPoolSize = 10`. A constant named PING_PERIOD_SECONDS
    # adds a hop without adding information, and the value is
    # already explained by the comment next to it where it is not
    # obvious.
    active: false
  LoopWithTooManyJumpStatements:
    # The WebSocket read loop skips non-text frames (continue) and
    # stops on a protocol mismatch (break). Both are the correct
    # response to that input; merging them would mean handling a
    # binary frame as a protocol error.
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    # ForgeWorker.doProbe returns early for each distinct failure
    # mode. That is the point: five failures, five answers, no
    # nested conditional pyramid.
    max: 10

exceptions:
  TooGenericExceptionCaught:
    # Deliberate in exactly two places: a health check and a worker
    # probe. Both exist to turn ANY failure into a reported state,
    # and a diagnostic that can propagate an exception is not a
    # diagnostic.
    active: false
  SwallowedException:
    active: false
